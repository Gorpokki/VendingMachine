name: Build and test

on:
  push:
    branches: ['1.21.1']
  pull_request:
    branches: ['1.21.1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build jar
        run: ./gradlew --no-daemon build
      - name: Run GameTests
        run: ./gradlew --no-daemon runGameTestServer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendingmachine-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-mods
          path: run/mods/*.jar
          if-no-files-found: error

  server-boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vendingmachine-jar
          path: server/mods
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: run-mods
          path: server/mods
      - name: Install NeoForge server
        working-directory: server
        run: |
          NEOFORGE_VERSION=$(sed -n 's/^neo_version=//p' ../gradle.properties)
          INSTALLER_URL="https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
          curl -fsSLo installer.jar "$INSTALLER_URL"
          curl -fsSLo installer.jar.sha256 "$INSTALLER_URL.sha256"
          echo "$(cut -d' ' -f1 installer.jar.sha256)  installer.jar" | sha256sum -c -
          java -jar installer.jar --installServer
          echo 'eula=true' > eula.txt
          ls mods
      - name: Boot the server with the built jar
        working-directory: server
        run: bash ../.github/scripts/boot-server.sh
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-log
          path: server/server.log

  # Pushes check the whole repository. A pull request labelled upstream-sync checks only the lines it changes.
  quality:
    # actionlint 1.7.12 rejects the self-repository form ($/...) that zizmor suggests.
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-repository]
    with:
      changed-lines-only: ${{ contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
