name: Build and test

on:
  push:
    branches: [ '1.21.1' ]
  pull_request:
    branches: [ '1.21.1' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOFORGE_VERSION: 21.1.257

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew --no-daemon build
      - name: Run GameTests
        run: ./gradlew --no-daemon runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: vendingmachine-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: run-mods
          path: run/mods/*.jar
          if-no-files-found: error

  server-boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: vendingmachine-jar
          path: server/mods
      - uses: actions/download-artifact@v4
        with:
          name: run-mods
          path: server/mods
      - name: Install NeoForge server
        working-directory: server
        run: |
          curl -fsSLo installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
          java -jar installer.jar --installServer
          echo 'eula=true' > eula.txt
          ls mods
      - name: Boot the server with the built jar
        working-directory: server
        run: bash ../.github/scripts/boot-server.sh
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/server.log
