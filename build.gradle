plugins {
    id 'java-library'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'info.solidsoft.pitest' version '1.19.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

configurations {
    // Mod jars loaded from the run's mods folder, so their bundled jars load too.
    runMods { transitive = false }
}

dependencies {
    compileOnly "maven.modrinth:create:${create_version_id}"
    compileOnly "curse.maven:numismatics-889722:${numismatics_file_id}"
    runMods "maven.modrinth:create:${create_version_id}"
    runMods "curse.maven:numismatics-889722:${numismatics_file_id}"
    compileOnly "maven.modrinth:ae2:${ae2_version_id}"
    runMods "maven.modrinth:ae2:${ae2_version_id}"
    runMods "maven.modrinth:guideme:${guideme_version_id}"
    // Jade is compile-only and left out of runMods, so the GameTests and the server boot run without it.
    compileOnly "maven.modrinth:jade:${jade_version_id}"
    // Recipe viewers: compiled against, never shipped or run, so the mod boots without either.
    compileOnly "maven.modrinth:jei:${jei_version_id}"
    compileOnly "maven.modrinth:emi:${emi_version_id}"
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Matches the Gson Minecraft 1.21.1 bundles, so the asset test parses JSON the way the game does.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.15'
}

// With -Pcoverage, the GameTest server records which mod lines the GameTests run; jacocoGameTestReport writes them
// as XML. The GameTests themselves and the client screen, which a server never loads, are left out of the report.
if (providers.gradleProperty('coverage').present) {
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        jacoco.applyTo(it)
        it.jacoco.includes = ["${mod_group_id}.*"]
        // The agent's output file would otherwise let Gradle skip a rerun with unchanged inputs.
        it.outputs.upToDateWhen { false }
    }
}

def gameTestCoverage = { task ->
    task.mustRunAfter 'runGameTestServer'
    task.executionData file('build/jacoco/runGameTestServer.exec')
    task.sourceDirectories.from sourceSets.main.java.srcDirs
    task.classDirectories.from sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude '**/gametest/**', '**/client/**'
    }
}

tasks.register('jacocoGameTestReport', JacocoReport) {
    gameTestCoverage(it)
    reports.xml.required = true
}

// Fails when the GameTests run under 80% of the mod's lines.
tasks.register('jacocoGameTestCoverageVerification', JacocoCoverageVerification) {
    gameTestCoverage(it)
    violationRules.rule { limit { counter = 'LINE'; minimum = 0.80 } }
}

// Mutation testing covers the Minecraft-free code that JUnit can run without a server.
pitest {
    pitestVersion = '1.30.1'
    junit5PluginVersion = '1.2.3'
    targetClasses = ["${mod_group_id}.util.CoinMath*"]
    // 30 of 33 mutants die. The 3 survivors are equivalent: no input tells them apart from the real code.
    mutationThreshold = 91
    timestampedReports = false
}

def copyRunMods = tasks.register('copyRunMods', Sync) {
    from configurations.runMods
    into layout.projectDirectory.dir('run/mods')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            gameDirectory = project.file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn copyRunMods }

jar {
    from('LICENSE')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
